name: Test and deploy static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/pdf.py
      - run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r downloads templates _site/
      - uses: actions/configure-pages@v5
      - name: Ensure llms.txt in Pages artifact
        run: mkdir -p _site && cp llms.txt _site/llms.txt
      - name: Ensure sitemap and robots in Pages artifact
        run: mkdir -p _site && cp sitemap.xml robots.txt _site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
